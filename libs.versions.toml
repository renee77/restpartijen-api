# Project catalog: versions of all libraries that are not in a toolchain catalog
# ($kotlin, $compose, $ktor, $spring). Modules refer to them as $libs.<key>, with the
# dashes in the key written as dots (ktor-server-di -> $libs.ktor.server.di).

[versions]
exposed = "1.5.0"
kotlinx-coroutines = "1.11.0"
# Compat variant on purpose: Exposed and Ktor both depend on it (see server/module.yaml).
kotlinx-datetime = "0.8.0-0.6.x-compat"
h2 = "2.4.240"
logback = "1.6.3"
spring = "7.0.9"
spring-security = "7.1.1"
bouncycastle = "1.86"
commons-logging = "1.3.5"
mockk = "1.14.11"

# App (modules shared and android)
# Material 3 that belongs to Compose 1.12.2 (an alpha, risk R-A10 in the FTD).
# Raise it together with settings.compose.version.
compose-material3 = "1.12.0-alpha03"
# Latest stable.
androidx-activity = "1.13.0"
# Latest stable. 4.3.0 is only a beta.
koin = "4.2.2"
# Latest stable.
navigation3 = "1.2.0"
# The version that belongs to Compose 1.12 according to JetBrains.
lifecycle = "2.11.0"

[libraries]
# Not in the $ktor catalog; the version comes from the Ktor BOM (settings.ktor in server/module.yaml).
ktor-server-di = { module = "io.ktor:ktor-server-di" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
spring-core = { module = "org.springframework:spring-core", version.ref = "spring" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto", version.ref = "spring-security" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# App (modules shared and android)
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
