name: Bug
description: Iets werkt niet zoals het hoort.
type: Bug
body:
  - type: textarea
    id: wat-gebeurt-er
    attributes:
      label: Wat gebeurt er?
      description: Beschrijf alleen wat je ziet, inclusief foutmelding.
    validations:
      required: true
  - type: textarea
    id: wat-verwacht-je
    attributes:
      label: Wat verwacht je?
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Stappen om te herhalen
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: omgeving
    attributes:
      label: Omgeving
      description: Branch of commit, en het apparaat of de emulator.
    validations:
      required: true
  - type: textarea
    id: vermoeden
    attributes:
      label: Vermoeden
      description: Wat je denkt dat de oorzaak is. Houd dit los van wat je hebt gezien.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Plak relevante logregels of een stacktrace.
      render: shell
