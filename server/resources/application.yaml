ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.restpartijen.api.ApplicationKt.module

database:
  mode: "$DB_MODE:memory"   # memory (default) or file
  file: ./data/restpartijen # only used when mode is file

jwt:
  secret: "$?JWT_SECRET"    # never a real value here. "$?" means: no error when the variable is missing; config then stops the application with a clear message (issue #5, B-52)
  issuer: restpartijen-api
  audience: restpartijen-app
  validityHours: 24