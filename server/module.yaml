product: jvm/app

settings:
  kotlin:
    version: 2.4.20
    serialization: json
  ktor:
    enabled: true
    version: 3.6.0
  jvm:
    mainClass: com.restpartijen.api.ApplicationKt
    jdk:
      version: 25

dependencies:
  - io.ktor:ktor-server-core
  - io.ktor:ktor-server-netty
  - io.ktor:ktor-server-config-yaml
  - io.ktor:ktor-server-content-negotiation
  - io.ktor:ktor-serialization-kotlinx-json
  - org.jetbrains.exposed:exposed-core:1.5.0
  - org.jetbrains.exposed:exposed-jdbc:1.5.0
  - org.jetbrains.exposed:exposed-kotlin-datetime:1.5.0
  - com.h2database:h2:2.4.240

test-dependencies:
  - io.ktor:ktor-server-test-host
  - io.mockk:mockk:1.14.11
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
