product: jvm/app

settings:
  kotlin:
    version: 2.4.20
    # The format is added as a dependency ($kotlin.serialization.json) instead of the deprecated `format` shortcut.
    serialization: enabled
    allWarningsAsErrors: true
  ktor:
    enabled: true
    version: 3.6.0
  jvm:
    mainClass: com.restpartijen.api.ApplicationKt
    jdk:
      version: 25

dependencies:
  - $ktor.server.core
  - $libs.ktor.server.di
  - $ktor.server.netty
  - $ktor.server.config.yaml
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $kotlin.serialization.json
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.kotlin.datetime
  # Used directly for opening hours (DayOfWeek, LocalTime; US-10), so declared here instead of relying on
  # Exposed and Ktor to bring it along. Same version they resolve to; both depend on this compat variant,
  # so a plain 0.8.0 could replace the variant they expect.
  - $libs.kotlinx.datetime
  - $libs.h2
  - $libs.kotlinx.coroutines.core
  - $ktor.server.statusPages
  - $ktor.server.requestValidation
  - $ktor.server.cors
  - $ktor.server.callLogging
  - $libs.logback.classic
  ############ HTTP client dependencies ############
  # Calls the Open Food Facts API for the barcode lookup (US-02, A5).
  - $ktor.client.core
  - $ktor.client.cio
  ############ Security dependencies ############
  - $ktor.server.auth
  - $ktor.server.auth.jwt
  # Library. Chosen because it is a well-known and widely used library for password hashing in Java/Kotlin applications.
  - $libs.spring.core
  - $libs.spring.security.crypto
  - $libs.bouncycastle.bcprov
  - $libs.commons.logging

test-dependencies:
  - $ktor.server.testHost
  # Replaces the real Open Food Facts API in the client tests.
  - $ktor.client.mock
  - $libs.mockk
  - $libs.kotlinx.coroutines.test

mavenPlugins:
  # prepare-agent attaches the JaCoCo agent to the test JVM; report turns the result into HTML.
  # The agent appends to build/maven-target/jacoco.exec on every test run, and the toolchain rejects
  # the `append` parameter, so delete that file first for a measurement of only the latest run.
  jacoco-maven-plugin.prepare-agent: enabled
  jacoco-maven-plugin.report:
    enabled: true
    configuration:
      # The toolchain does not resolve the default ${project.reporting.outputDirectory}, and references
      # are not supported in this file, so the path is relative to server/, next to jacoco.exec.
      outputDirectory: ../build/maven-target/reports/jacoco
